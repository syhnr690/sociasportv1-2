    <script>
      (function() {
        try {
          var _origFetch = (typeof window !== 'undefined' && typeof window.fetch === 'function') 
            ? window.fetch.bind(window) 
            : undefined;
          
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // fallback silent
        }
      })();
    </script>
